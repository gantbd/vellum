[package]
name = "vellum-launchd-activate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Explicitly authorized macOS launchd activation and rollback for Vellum"

[lib]
name = "vellum_launchd_activate"

[[bin]]
name = "vellum-launchd-activate"
path = "src/main.rs"

[dependencies]
rustix = { version = "=1.1.6", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2.workspace = true

[dev-dependencies]
vellum-launchd-render = { path = "../launchd-render" }

[lints]
workspace = true
