[package]
name = "vellum-launchd-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Inert macOS launchd profile renderer for Vellum"

[lib]
name = "vellum_launchd_render"

[[bin]]
name = "vellum-launchd-render"
path = "src/main.rs"

[dependencies]
rustix = { version = "=1.1.6", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
