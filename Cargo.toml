[workspace]
members = ["crates/vellum-sdk", "crates/vellum-session", "crates/vellum-model"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/vellum-sdk"
publish = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
