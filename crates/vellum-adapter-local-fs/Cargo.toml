[package]
name = "vellum-adapter-local-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded local filesystem resource adapter for Vellum"

[dependencies]
vellum-engine = { version = "=0.1.0", path = "../../../vellum/crates/vellum-engine" }
vellum-host = { version = "=0.1.0", path = "../../../vellum-sdk/crates/vellum-host" }

[target.'cfg(target_os = "macos")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "deny"
