[package]
name = "vellum-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded current-protocol MCP projection for Vellum"

[lib]
name = "vellum_mcp"

[[bin]]
name = "vellum-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.151"
vellum-client = { version = "=0.1.0", path = "../vellum-client" }
vellum-protocol = { version = "=0.1.0", path = "../vellum-protocol" }
vellum-transport = { version = "=0.1.0", path = "../vellum-transport" }

[dev-dependencies]
vellum-adapter-local-fs = { version = "=0.1.0", path = "../../../vellum-adapters/crates/vellum-adapter-local-fs" }
vellum-daemon = { version = "=0.1.0", path = "../vellum-daemon" }
vellum-editor = { version = "=0.1.0", path = "../vellum-editor" }
vellum-service = { version = "=0.1.0", path = "../vellum-service" }

[lints]
workspace = true
