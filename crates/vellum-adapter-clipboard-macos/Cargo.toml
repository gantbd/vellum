[package]
name = "vellum-adapter-clipboard-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded eager plain-text AppKit clipboard I/O, outside the editor engine"

[features]
private-pasteboard-qualification = []

[[example]]
name = "private-pasteboard"
required-features = ["private-pasteboard-qualification"]

[target.'cfg(target_os = "macos")'.dependencies]
vellum-engine = { version = "=0.1.0", path = "../vellum-engine" }
vellum-model = { version = "=0.1.0", path = "../vellum-model" }
vellum-session = { version = "=0.1.0", path = "../vellum-session" }
objc2 = { version = "=0.6.5", features = ["exception"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSThread"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
vellum-adapter-local-fs = { version = "=0.1.0", path = "../vellum-adapter-local-fs" }
vellum-adapter-annotation-json = { version = "=0.1.0", path = "../vellum-adapter-annotation-json" }

[lints]
workspace = true
