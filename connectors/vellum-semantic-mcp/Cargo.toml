[package]
name = "vellum-semantic-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded stdio MCP peer and projection library for Vellum semantic queries"

[dependencies]
getrandom.workspace = true
serde = "=1.0.229"
serde_json = "=1.0.151"
tokio = { version = "1", features = ["io-util", "io-std", "rt"] }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../../adapters/local-authentication" }
vellum-sdk-client = { version = "=0.1.0", path = "../../sdk/client" }
vellum-semantic-client = { version = "=0.1.0", path = "../../client/vellum-semantic-client" }
vellum-semantic-protocol = { version = "=0.1.0", path = "../../protocol/vellum-semantic-protocol" }
vellum-semantic-session-client = { version = "=0.1.0", path = "../../client/vellum-semantic-session-client" }
vellum-semantic-service = { version = "=0.1.0", path = "../../service/vellum-semantic-service" }
vellum-semantic-transport = { version = "=0.1.0", path = "../../transport/vellum-semantic-transport" }

[lints]
workspace = true

[[bin]]
name = "vellum-semantic-mcp"
path = "src/main.rs"
