[package]
name = "vellum-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Local Unix service composition for Vellum"

[lib]
name = "vellum_daemon"

[[bin]]
name = "vellum-daemon"
path = "src/main.rs"

[dependencies]
keystone-observe = { version = "=0.0.1", git = "https://github.com/gantbd/keystone", rev = "2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4" }
keystone-lifecycle = { version = "=0.0.1", git = "https://github.com/gantbd/keystone", rev = "2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4" }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
vellum-adapter-local-fs = { version = "=0.1.0", path = "../../adapters/local-fs" }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../../adapters/local-authentication" }
vellum-host = { version = "=0.1.0", path = "../../host/vellum-host" }
vellum-protocol = { version = "=0.1.0", path = "../../protocol/vellum-protocol" }
vellum-service = { version = "=0.1.0", path = "../../service/vellum-service" }
vellum-transport = { version = "=0.1.0", path = "../../transport/vellum-transport" }
vellum-wire = { version = "=0.1.0", path = "../../protocol/vellum-wire" }
vellum-workspace = { version = "=0.1.0", path = "../../host/vellum-workspace" }

[dev-dependencies]
vellum-client = { version = "=0.1.0", path = "../../client/vellum-client" }
vellum-editor = { version = "=0.1.0", path = "../../host/vellum-editor" }

[lints]
workspace = true
