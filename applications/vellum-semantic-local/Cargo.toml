[package]
name = "vellum-semantic-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Local supervised semantic-provider composition for Vellum"

[dependencies]
getrandom.workspace = true
processkit = { version = "=3.3.4", features = ["limits"] }
sha2.workspace = true
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../../adapters/local-authentication" }
vellum-adapter-semantic-lsp = { version = "=0.1.0", path = "../../adapters/semantic-lsp" }
vellum-host = { version = "=0.1.0", path = "../../host/vellum-host" }
vellum-semantic-client = { version = "=0.1.0", path = "../../client/vellum-semantic-client" }
vellum-semantic-protocol = { version = "=0.1.0", path = "../../protocol/vellum-semantic-protocol" }
vellum-semantic-session-client = { version = "=0.1.0", path = "../../client/vellum-semantic-session-client" }
vellum-semantic-wire = { version = "=0.1.0", path = "../../protocol/vellum-semantic-wire" }
vellum-semantic-service = { version = "=0.1.0", path = "../../service/vellum-semantic-service" }
vellum-semantic-session-actor = { version = "=0.1.0", path = "../../service/vellum-semantic-session-actor" }
vellum-semantic-session-broker = { version = "=0.1.0", path = "../../service/vellum-semantic-session-broker" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["process"] }

[dev-dependencies]
vellum-semantic-transport = { version = "=0.1.0", path = "../../transport/vellum-semantic-transport" }

[lints]
workspace = true

[[bin]]
name = "vellum-semantic-local"
path = "src/main.rs"
