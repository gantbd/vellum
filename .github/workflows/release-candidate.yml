name: Release candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  daemon-and-mcp:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact Vellum revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/vellum
          ref: ${{ github.sha }}
          path: vellum
          persist-credentials: false
      - name: Check out coordinated Keystone revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 3486252cdbaeb2d784756076f43ef6157ed0b7f8
          path: keystone
          persist-credentials: false
      - name: Verify release policy and candidate builder
        working-directory: vellum
        run: |
          make check-release-contract
          node --check scripts/build-release-candidate.mjs
          node scripts/build-release-candidate.test.mjs
          make check-artifact-lifecycle
          make check-activation-transaction
          make check-launchd-distribution
      - name: Build and stage locked candidate
        working-directory: vellum
        run: >-
          node scripts/build-release-candidate.mjs
          --vellum-revision=${{ github.sha }}
          --output-dir=../candidate
      - name: Upload unsigned candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vellum-daemon-mcp-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
