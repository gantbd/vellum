name: Release candidate artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  daemon-and-mcp:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out exact Vellum revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/vellum
          ref: ${{ github.sha }}
          path: vellum
          persist-credentials: false
      - name: Check out coordinated Keystone revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 3486252cdbaeb2d784756076f43ef6157ed0b7f8
          path: keystone
          persist-credentials: false
      - name: Prefetch the exact locked dependency graph
        working-directory: vellum
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/vellum-release-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          printf '[url "file://${{ github.workspace }}/keystone"]\n\tinsteadOf = https://github.com/gantbd/keystone\n' > "$GIT_CONFIG_GLOBAL"
          cargo fetch --locked
      - name: Verify release policy and candidate builder
        working-directory: vellum
        run: |
          make check-release-contract
          node --check scripts/build-release-candidate.mjs
          node scripts/build-release-candidate.test.mjs
          make check-artifact-lifecycle
          make check-clean-release-candidate
          make check-candidate-bundle
          make check-candidate-install
          make check-activation-transaction
          make check-launchd-distribution
          make check-launchd-activation
          make check-shipped-mcp
          npm ci --ignore-scripts --no-audit --no-fund --prefix qualification/mcp-official-client
          make qualify-mcp-official-client
      - name: Build twice from exact clean source and compare bytes
        working-directory: vellum
        run: >-
          node scripts/qualify-clean-release-candidate.mjs
          --vellum-ref=${{ github.sha }}
          --output-dir=../release-candidate
      - name: Package and round-trip the download product
        working-directory: vellum
        run: |
          node scripts/package-release-candidate.mjs \
            --qualified-dir=../release-candidate \
            --bundle-file=../vellum-release-candidate.tar
          chmod 0644 ../vellum-release-candidate.tar
          node scripts/verify-release-candidate-bundle.mjs \
            --bundle-file=../vellum-release-candidate.tar
          mkdir -m 0700 ../vellum-candidate-install
          node scripts/install-release-candidate.mjs \
            --bundle-file=../vellum-release-candidate.tar \
            --install-root=../vellum-candidate-install
          ../vellum-candidate-install/bin/vellum-daemon --help
          ../vellum-candidate-install/bin/vellum-mcp --help
      - name: Upload unsigned candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vellum-daemon-mcp-launchd-${{ github.sha }}
          path: vellum-release-candidate.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
