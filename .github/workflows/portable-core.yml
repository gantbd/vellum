name: Portable core compilation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portable-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-library-closure:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out Vellum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Compile the portable host-library closure
        run: >-
          cargo check --locked --lib
          -p vellum-client
          -p vellum-editor
          -p vellum-engine
          -p vellum-host
          -p vellum-protocol
          -p vellum-sdk-client
          -p vellum-sdk-embedded
          -p vellum-sdk-semantic-client
          -p vellum-semantic-apply-service
          -p vellum-semantic-client
          -p vellum-semantic-helper-protocol
          -p vellum-semantic-helper-wire
          -p vellum-semantic-protocol
          -p vellum-semantic-service
          -p vellum-semantic-session-actor
          -p vellum-semantic-session-broker
          -p vellum-semantic-session-client
          -p vellum-semantic-wire
          -p vellum-service
          -p vellum-session
          -p vellum-wire
          -p vellum-workspace-client
